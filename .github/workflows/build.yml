name: Build

# 触发方式：
#   - 手动：Actions 页面 → Build → Run workflow
#   - 推送 main / 提交 PR：验证三个平台的打包流程
#   - 推送 v* 标签：构建并把安装包附加到对应的 GitHub Release
on:
  workflow_dispatch:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  # 必须与 go.mod / README 中固定的 Wails v3 版本一致，
  # 否则 build/ 下由模板生成的 Taskfile 与 CLI 可能不匹配。
  WAILS_VERSION: v3.0.0-beta.23
  NODE_VERSION: "24"

jobs:
  # ---------------------------------------------------------------------------
  # 版本号：tag 构建取 tag（去掉 v 前缀），其余取 build/config.yml 的 info.version
  # ---------------------------------------------------------------------------
  version:
    name: Resolve version
    runs-on: ubuntu-latest
    outputs:
      value: ${{ steps.resolve.outputs.value }}
    steps:
      - uses: actions/checkout@v4

      - id: resolve
        name: Resolve version
        run: |
          set -euo pipefail
          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            version="${GITHUB_REF_NAME#v}"
          else
            version="$(sed -n 's/^[[:space:]]*version:[[:space:]]*"\([^"]*\)".*/\1/p' build/config.yml | head -n1)"
          fi
          echo "value=${version:-0.0.0}" >> "$GITHUB_OUTPUT"

  # ---------------------------------------------------------------------------
  # macOS：Intel(x86_64) 与 Apple Silicon(arm64) 各自产出 .app 与 .dmg
  # ---------------------------------------------------------------------------
  macos:
    name: macOS ${{ matrix.release_arch }}
    needs: version
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          # Apple Silicon：在 arm64 runner 上原生构建
          - runner: macos-latest
            arch: arm64
            release_arch: arm64
          # Intel：在 Intel runner 上原生构建。若 macos-15-intel 标签不可用，
          # 可改成 macos-latest —— Go 支持在 arm64 主机上交叉编译 darwin/amd64，
          # build/darwin/Taskfile.yml 已配好 CGO 交叉编译参数。
          - runner: macos-15-intel
            arch: amd64
            release_arch: x64
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Put Go bin on PATH
        run: echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"

      - name: Install Wails v3 CLI
        run: go install "github.com/wailsapp/wails/v3/cmd/wails3@${WAILS_VERSION}"

      # 应用的「当前版本」来自编译进二进制的 build/config.yml（见 version.go）。
      # tag 构建时把解析出来的版本号写回构建资产，让包内版本与 tag 保持一致。
      - name: Apply release version
        shell: bash
        env:
          VERSION: ${{ needs.version.outputs.value }}
        run: |
          set -euo pipefail
          perl -0pi -e 's/^(\s*version:\s*)"[^"]*"/${1}"'"$VERSION"'"/m' build/config.yml
          perl -0pi -e 's#(<key>CFBundleShortVersionString</key>\s*<string>)[^<]*(</string>)#${1}'"$VERSION"'${2}#g; s#(<key>CFBundleVersion</key>\s*<string>)[^<]*(</string>)#${1}'"$VERSION"'${2}#g' build/darwin/Info.plist
          perl -0pi -e 's/("(?:file_version|ProductVersion)":\s*")[^"]*(")/${1}'"$VERSION"'${2}/g' build/windows/info.json
          grep -n '^  version:' build/config.yml
          grep -n -A1 'CFBundleShortVersionString' build/darwin/Info.plist
          grep -n 'Version' build/windows/info.json

      # package:dmg = build（前端 + 绑定 + .app）→ ad-hoc 签名 → 生成 .dmg
      - name: Build .app and .dmg
        run: wails3 task darwin:package:dmg ARCH=${{ matrix.arch }}

      - name: Collect artifacts
        env:
          VERSION: ${{ needs.version.outputs.value }}
          SUFFIX: macos-${{ matrix.release_arch }}
        run: |
          set -euo pipefail
          mv bin/Veda.dmg "bin/Veda-${VERSION}-${SUFFIX}.dmg"
          # 用 ditto 打包 .app，保留可执行权限与 bundle 结构
          ditto -c -k --keepParent bin/Veda.app "bin/Veda-${VERSION}-${SUFFIX}.app.zip"
          ls -lh bin

      - uses: actions/upload-artifact@v4
        with:
          name: macos-${{ matrix.release_arch }}
          if-no-files-found: error
          retention-days: 14
          path: |
            bin/Veda-${{ needs.version.outputs.value }}-macos-${{ matrix.release_arch }}.dmg
            bin/Veda-${{ needs.version.outputs.value }}-macos-${{ matrix.release_arch }}.app.zip

  # ---------------------------------------------------------------------------
  # Windows：x64(amd64) 的 Veda.exe 与 NSIS 安装程序
  # ---------------------------------------------------------------------------
  windows:
    name: Windows x64
    needs: version
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Put Go bin on PATH
        shell: bash
        run: echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"

      - name: Install Wails v3 CLI
        shell: bash
        run: go install "github.com/wailsapp/wails/v3/cmd/wails3@${WAILS_VERSION}"

      # NSIS（makensis）用于生成安装程序：runner 镜像不带它，而 choco 安装完
      # 当前会话的 PATH 不会刷新，必须显式写入 GITHUB_PATH 供后续步骤使用。
      - name: Ensure NSIS is installed
        shell: pwsh
        run: |
          if (-not (Get-Command makensis -ErrorAction SilentlyContinue)) {
            choco install nsis --no-progress -y
          }
          $candidates = @()
          if (Get-Command makensis -ErrorAction SilentlyContinue) {
            $candidates += Split-Path (Get-Command makensis).Source
          }
          $candidates += "${env:ProgramFiles(x86)}\NSIS", "$env:ProgramFiles\NSIS"
          $nsisDir = $candidates |
            Where-Object { $_ -and (Test-Path (Join-Path $_ 'makensis.exe')) } |
            Select-Object -First 1
          if (-not $nsisDir) { throw "NSIS (makensis.exe) not found after choco install" }
          Add-Content -Path $env:GITHUB_PATH -Value $nsisDir
          & (Join-Path $nsisDir 'makensis.exe') -VERSION

      # 应用的「当前版本」来自编译进二进制的 build/config.yml（见 version.go）。
      # tag 构建时把解析出来的版本号写回构建资产，让包内版本与 tag 保持一致。
      - name: Apply release version
        shell: bash
        env:
          VERSION: ${{ needs.version.outputs.value }}
        run: |
          set -euo pipefail
          perl -0pi -e 's/^(\s*version:\s*)"[^"]*"/${1}"'"$VERSION"'"/m' build/config.yml
          perl -0pi -e 's#(<key>CFBundleShortVersionString</key>\s*<string>)[^<]*(</string>)#${1}'"$VERSION"'${2}#g; s#(<key>CFBundleVersion</key>\s*<string>)[^<]*(</string>)#${1}'"$VERSION"'${2}#g' build/darwin/Info.plist
          perl -0pi -e 's/("(?:file_version|ProductVersion)":\s*")[^"]*(")/${1}'"$VERSION"'${2}/g' build/windows/info.json
          grep -n '^  version:' build/config.yml
          grep -n -A1 'CFBundleShortVersionString' build/darwin/Info.plist
          grep -n 'Version' build/windows/info.json

      # windows:package = build（前端 + 绑定 + syso + Veda.exe）→ NSIS 安装程序
      - name: Build Veda.exe and NSIS installer
        shell: bash
        run: wails3 package GOOS=windows GOARCH=amd64

      - name: Collect artifacts
        shell: bash
        env:
          VERSION: ${{ needs.version.outputs.value }}
        run: |
          set -euo pipefail
          mkdir -p out
          cp bin/Veda.exe "out/Veda-${VERSION}-windows-x64.exe"
          cp bin/Veda-amd64-installer.exe "out/Veda-${VERSION}-windows-x64-setup.exe"
          ls -lh out

      - uses: actions/upload-artifact@v4
        with:
          name: windows-x64
          if-no-files-found: error
          retention-days: 14
          path: |
            out/Veda-${{ needs.version.outputs.value }}-windows-x64.exe
            out/Veda-${{ needs.version.outputs.value }}-windows-x64-setup.exe

  # ---------------------------------------------------------------------------
  # 推送 v* 标签时，把三个平台的安装包附到 Release 上
  # ---------------------------------------------------------------------------
  release:
    name: Publish release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [version, macos, windows]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: List files
        run: ls -lhR dist

      - uses: softprops/action-gh-release@v2
        with:
          fail_on_unmatched_files: true
          generate_release_notes: true
          files: |
            dist/*.dmg
            dist/*.app.zip
            dist/*-windows-x64.exe
            dist/*-windows-x64-setup.exe
